
<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta name="theme-color" content="#fbfcfc" />
    <meta
      name="description"
      content="دليلك داخل مؤتمر التخصصات الصحية — تجربة تفاعلية للعلم والابتكار."
    />

    <title>HPC-Guide</title>
    <link rel="preload" href="/videos/hpc-hero-poster.webp" as="image" fetchpriority="high" />
    <link rel="preload" href="/fonts/thmanyahsans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/thmanyahsans-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/thmanyahsans-Black.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/images/hpc-logo_739bab33-optimized.png" as="image" fetchpriority="high" />
    <style>
      /* The first-paint poster and the React film share the same fade. */
      :root {
        --hpc-home-hero-fade: linear-gradient(
          to bottom,
          #000 55%,
          rgb(0 0 0 / 96%) 64%,
          rgb(0 0 0 / 83%) 74%,
          rgb(0 0 0 / 57%) 84%,
          rgb(0 0 0 / 24%) 93%,
          rgb(0 0 0 / 4%) 98%,
          transparent 100%
        );
      }

      /* Match the homepage film until React supplies its poster and header. */
      html[data-home-boot] #root:not(:has(main)) {
        --boot-header-height: 121px;
        --boot-film-height: clamp(480px, 72svh, 840px);
        --boot-film-position: 45%;
      }

      @media (max-width: 900px) {
        html[data-home-boot] #root:not(:has(main)) { --boot-header-height: 67px; }
        html[data-home-boot="compact"] #root:not(:has(main)) { --boot-header-height: 101px; }
      }

      @media (max-width: 600px) {
        html[data-home-boot] #root:not(:has(main)) {
          --boot-film-height: clamp(420px, 68svh, 620px);
          --boot-film-position: 50%;
        }
      }

      html[data-home-boot] #root:not(:has(main))::before,
      html[data-home-boot] #root:not(:has(main))::after {
        content: "";
        position: fixed;
        inset-inline: 0;
        pointer-events: none;
      }

      html[data-home-boot] #root:not(:has(main))::before {
        inset-block: 0;
        background: linear-gradient(#fff, #fff) top / 100% var(--boot-header-height) no-repeat #1b2e40;
      }

      html[data-home-boot] #root:not(:has(main))::after {
        inset-block-start: var(--boot-header-height);
        block-size: var(--boot-film-height);
        background:
          radial-gradient(ellipse 50% 50% at center, rgb(27 46 64 / 40%) 0%, rgb(27 46 64 / 25%) 38%, rgb(27 46 64 / 10%) 76%, transparent 100%)
            center 46% / min(100%, 1160px) clamp(200px, 40%, 300px) no-repeat,
          url("/videos/hpc-hero-poster.webp") center var(--boot-film-position) / cover no-repeat;
        -webkit-mask-image: var(--hpc-home-hero-fade);
        mask-image: var(--hpc-home-hero-fade);
      }

      /* HPC - Prevent Blue Loading Flash */

html[data-home-boot]:not(:has(#root main)),
html[data-home-boot]:not(:has(#root main)) body {
  background: #1b2e40 !important;
}

    </style>
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="icon" type="image/png" href="/images/hpc-logo_739bab33-optimized.png" />

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const route = params.get("__hpc_route");

        if (
  route &&
  route.startsWith("/") &&
  !route.startsWith("//")
) {
  window.history.replaceState(null, "", route);
}
        if (location.pathname.replace(/\/+$/, "") === "%BASE_URL%".replace(/\/+$/, "")) {
          document.documentElement.dataset.homeBoot =
            history.state?.hpcHeaderHeight === "compact" ? "compact" : "standard";
          history.scrollRestoration = "manual";
          // Home positions its fragment after CMS sections mount. Keep the browser
          // from running a second fragment scroll during document load.
          if (location.hash && !location.hash.startsWith("#:~:")) {
            history.replaceState(
              { ...history.state, hpcPendingHomeHash: location.hash },
              "",
              location.pathname + location.search
            );
          }
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
